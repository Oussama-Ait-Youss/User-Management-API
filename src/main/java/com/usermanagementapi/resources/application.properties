# -------------------------------------------------------------
# Configuration PostgreSQL & HikariCP
# -------------------------------------------------------------
db.driverClassName=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/usermanagement_db
db.username=postgres
db.password=postgrespassword

# Paramètres du Pool de Connexions HikariCP
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=30000
hikari.poolName=PostgresHikariPool

# -------------------------------------------------------------
# Paramètres Hibernate / JPA Provider
# -------------------------------------------------------------
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true