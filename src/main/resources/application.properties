# Persistent H2 files are stored under the current operating-system user's home,
# independently of IntelliJ's or Tomcat's working directory.
db.directory=${user.home}/.user-management-api/data
db.driverClassName=org.h2.Driver
db.url=jdbc:h2:file:${db.directory}/user_management_db;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=30000
hikari.poolName=UserManagementHikariPool

hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.format_sql=true
